<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070E1B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RG Admin">
<title>RG Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
:root{--bg:#070E1B;--card:#0F1B30;--card2:#15243D;--line:#1F3050;--ink:#E8ECF3;--mute:#8C9AB3;--gold:#D4AF37;--gold2:#F5D77A;--ok:#10B981;--bad:#EF4444;--warn:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body{overscroll-behavior-y:none}
.serif{font-family:Fraunces,Georgia,serif}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* Bloqueo */
#lock{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);background:radial-gradient(500px 400px at 50% 20%,rgba(212,175,55,.18),transparent 60%),var(--bg);transition:opacity .45s,transform .5s cubic-bezier(.2,.8,.2,1)}
#lock.fuera{opacity:0;transform:scale(1.08);pointer-events:none}
#lock svg{width:84px;color:var(--gold);filter:drop-shadow(0 0 14px rgba(212,175,55,.5))}
#lock h1{font-size:1.5rem;letter-spacing:5px}
#lockMsg{color:var(--mute);font-size:.9rem;min-height:1.2em}
#dots{display:flex;gap:16px}#dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);transition:background .15s,transform .15s}
#dots i.on{background:var(--gold);transform:scale(1.1)}#dots.mal{animation:sacude .4s}#dots.mal i{border-color:var(--bad)}
@keyframes sacude{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px;margin-top:8px}
.pad button{height:76px;border-radius:50%;background:rgba(255,255,255,.06);font-size:1.7rem;font-weight:500;transition:background .15s,transform .1s}
.pad button:active{background:rgba(212,175,55,.3);transform:scale(.94)}.pad .vacio{visibility:hidden}
/* App */
#app{min-height:100%;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;background:rgba(7,14,27,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.top small{color:var(--gold);font-size:.68rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase}
.top h1{font-size:1.85rem;line-height:1.1;margin-top:2px}
.top .acc{display:flex;gap:8px}.top .acc button{width:38px;height:38px;border-radius:50%;background:var(--card2);font-size:1rem}
main{padding:16px 16px 0;animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
.hero{border-radius:22px;padding:22px;background:radial-gradient(300px 160px at 90% 0,rgba(212,175,55,.3),transparent 70%),linear-gradient(140deg,#13284A,#0A192F);border:1px solid rgba(212,175,55,.3);margin-bottom:14px}
.hero small{font-size:.68rem;font-weight:700;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase}
.hero b{display:block;font-family:Fraunces,serif;font-size:2.6rem;margin:6px 0 2px;background:linear-gradient(180deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero span{color:var(--mute);font-size:.82rem}
.metodos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.metodos div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.metodos small{display:block;font-size:.66rem;color:var(--mute);font-weight:600}.metodos b{font-size:.98rem}
h2.sec{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin:6px 4px 10px;font-weight:700}
.lista{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.item:active{background:var(--card2)}
.item .t{font-weight:600;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{grid-column:1;color:var(--mute);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{grid-row:1/3;grid-column:2;text-align:right;font-weight:700}
.item .m small{display:block;font-weight:600;font-size:.7rem;color:var(--mute)}
.vacio{text-align:center;color:var(--mute);padding:40px 20px}.vacio b{display:block;font-family:Fraunces,serif;font-size:1.3rem;color:var(--ink);margin-bottom:6px}
/* Sheet */
#sheetBg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;border-top:1px solid rgba(212,175,55,.35);padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.3,1)}
body.sheet-on #sheetBg{opacity:1;pointer-events:auto}body.sheet-on #sheet{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}
#sheet h3{font-family:Fraunces,serif;font-size:1.5rem;margin-bottom:4px}
#sheet .muted{color:var(--mute);font-size:.88rem;line-height:1.5;margin-bottom:14px}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}
.datos div{background:var(--card2);border-radius:12px;padding:10px 12px}.datos small{display:block;font-size:.66rem;color:var(--mute);font-weight:700;letter-spacing:.6px;text-transform:uppercase}.datos b{font-size:.98rem}
.datos .ancho{grid-column:1/-1}.datos .ancho b{font-weight:500;font-size:.88rem;line-height:1.5}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--card2);font-weight:700;font-size:.95rem;margin-top:8px}
.btn.rojo{background:var(--bad);color:#fff}.btn.oro{background:var(--gold);color:#0A192F}
.campo{width:100%;padding:14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:500 1rem Inter,sans-serif;outline:0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:60;transform:translate(-50%,-140%);background:var(--card2);border:1px solid var(--gold);padding:12px 18px;border-radius:14px;font-size:.88rem;font-weight:600;max-width:92vw;transition:transform .35s}
#toast.on{transform:translate(-50%,0)}#toast.err{border-color:var(--bad)}
</style>
</head>
<body>

<div id="lock">
  <svg viewBox="0 0 120 70" fill="none" stroke="currentColor"><ellipse cx="40" cy="35" rx="25" ry="20" stroke-width="2.6"/><ellipse cx="80" cy="35" rx="25" ry="20" stroke-width="2.6"/><path d="M 55 32 Q 60 26 65 32 M 22 25 L 12 25 M 98 25 L 108 25" stroke-width="2.6" stroke-linecap="round"/></svg>
  <h1 class="serif">RG ADMIN</h1>
  <div id="lockMsg"></div>
  <div id="dots"></div>
  <div class="pad" id="pad"></div>
</div>

<div id="app" hidden>
  <header>
    <div class="top">
      <div><small>RG Ópticas · Admin</small><h1 class="serif">Caja de hoy</h1></div>
      <div class="acc"><button id="btnRef" title="Actualizar">↻</button><button id="btnLock" title="Bloquear">🔒</button></div>
    </div>
  </header>
  <main id="vista"></main>
</div>

<div id="sheetBg"></div><div id="sheet"></div><div id="toast"></div>

<script>
// Firebase
firebase.initializeApp({apiKey:"AIzaSyBgTC6qeXBlnS_mQTVkZ19ueKgZIOrgRnk",authDomain:"optica-rg--2.firebaseapp.com",projectId:"optica-rg--2",storageBucket:"optica-rg--2.firebasestorage.app",messagingSenderId:"786320956490",appId:"1:786320956490:web:77c39f0585c31de77b1ab3"});
const db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=h=>String(h??'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
const money=n=>'$'+(Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const vibra=(p=12)=>navigator.vibrate&&navigator.vibrate(p);

const S={ventas:[],listo:false,login:false};

function toast(m,err){const t=$('toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className=err?'err':'',3000)}
function abrirSheet(html){$('sheet').innerHTML='<div class="grab"></div>'+html;$('sheet').scrollTop=0;document.body.classList.add('sheet-on')}
function cerrarSheet(){document.body.classList.remove('sheet-on')}
$('sheetBg').onclick=()=>{if(!S.login)cerrarSheet()};

function confirmar(titulo,detalle,txt){
  return new Promise(res=>{
    abrirSheet(`<h3>${titulo}</h3><p class="muted">${detalle}</p><button class="btn rojo" id="cfOk">${txt}</button><button class="btn" id="cfNo">Cancelar</button>`);
    $('cfOk').onclick=()=>{cerrarSheet();res(true)};$('cfNo').onclick=()=>{cerrarSheet();res(false)};
  });
}

// PIN
async function hash(t){
  const txt='rg-admin:'+t;
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
    return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h=0;for(const c of txt)h=(h*31+c.charCodeAt(0))|0;return'h'+h;
}

let pinBuf='',pinPaso=localStorage.getItem('rg_admin_pin')?'entrar':'crear',pinPrimero='';
const MSG={entrar:'Ingresa tu PIN',crear:'Crea un PIN de 4 dígitos',confirmar:'Escríbelo otra vez para confirmar'};

function pintarLock(m){
  $('lockMsg').textContent=m\vert{}\vert{}MSG[pinPaso];$('dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('');
}

$('pad').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>`<button class="${k?'':'vacio'}" data-k="${k}">${k}</button>`).join('');
$('pad').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.k)tecla(b.dataset.k)};

async function tecla(k){
  vibra(8);
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);return pintarLock()}
  if(pinBuf.length>=4)return;
  pinBuf+=k;
  pintarLock();
  if(pinBuf.length<4)return;

  const h=await hash(pinBuf);
  if(pinPaso==='crear'){pinPrimero=h;pinPaso='confirmar';pinBuf='';return setTimeout(()=>pintarLock(),180)}
  if(pinPaso==='confirmar'){
    if(h===pinPrimero){localStorage.setItem('rg_admin_pin',h);pinPaso='entrar';desbloquear()}
    else{pinPaso='crear';errorPin('No coinciden. Crea tu PIN de nuevo')}
    return;
  }
  if(h===localStorage.getItem('rg_admin_pin'))desbloquear();
  else errorPin('PIN incorrecto');
}

function errorPin(m){$('dots').classList.add('mal');vibra([60,40,60]);setTimeout(()=>{$('dots').classList.remove('mal');pinBuf='';pintarLock(m)},450)}

function desbloquear(){
  pinBuf='';$('lock').classList.add('fuera');$('app').hidden=false;
  if(!S.listo){S.listo=true;asegurarSesion(iniciar)}
}

function asegurarSesion(fn){
  let hecho=false;
  firebase.auth().onAuthStateChanged(u=>{
    if(u){S.login=false;cerrarSheet();if(!hecho){hecho=true;fn()}}
    else hojaLogin();
  });
}

function hojaLogin(){
  S.login=true;
  abrirSheet(`<h3>Inicia sesión</h3><p class="muted">Con tu cuenta de administrador de Ópticas RG.</p>
    <input id="lgMail" class="campo" type="email" placeholder="Correo" autocomplete="username">
    <input id="lgPass" class="campo" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn oro" id="lgBtn">Entrar</button><p id="lgErr" class="muted" style="color:var(--bad);margin-top:10px"></p>`);
  $('lgBtn').onclick=()=>{$('lgBtn').textContent='Entrando…';
    firebase.auth().signInWithEmailAndPassword($('lgMail').value.trim().toLowerCase(),$('lgPass').value)
      .catch(e=>{$('lgErr').textContent=e.message})
      .finally(()=>{const b=$('lgBtn');if(b)b.textContent='Entrar'});
  };
}

function bloquear(){pinPaso='entrar';pinBuf='';pintarLock();cerrarSheet();$('lock').classList.remove('fuera')}$('btnLock').onclick=bloquear;
$('btnRef').onclick=()=>{vibra();location.reload()};
pintarLock();

// Datos y Render
function iniciar(){
  db.collection('config').doc('ventasDiarias').onSnapshot(d=>{
    S.ventas=(d.exists&&d.data().lista)||[];
    pintar();
  },e=>toast('Sin conexión: '+e.message,1));
}

function pintar(){
  const total=S.ventas.reduce((s,x)=>s+(Number(x.monto)||0),0);
  const m=k=>S.ventas.filter(x=>(x.metodo||'Efectivo')===k).reduce((s,x)=>s+(Number(x.monto)||0),0);
  const items=S.ventas.map((x,i)=>({...x,_i:i})).reverse();

  $('vista').innerHTML=`
    <div class="hero">
      <small>Total de la jornada</small>
      <b>${money(total)}</b>
      <span>${S.ventas.length} movimientos</span>
    </div>
    <div class="metodos">
      <div><small>💵 Efectivo</small><b>${money(m('Efectivo'))}</b></div>
      <div><small>💳 Tarjeta</small><b>${money(m('Tarjeta'))}</b></div>
      <div><small>🏦 Transf.</small><b>${money(m('Transferencia'))}</b></div>
    </div>
    <h2 class="sec">Movimientos</h2>
    ${items.length?`<div class="lista">${items.map(x=>`
      <button class="item" onclick="hojaMov(${x._i})">
        <span class="t">${esc(x.paciente||'Mostrador')}</span>
        <span class="m">${money(x.monto)}<small>${esc(x.metodo||'Efectivo')}</small></span>
        <span class="s">${esc(x.hora||'')} · ${esc(strip(x.concepto))}</span>
      </button>`).join('')}</div>`:'<div class="vacio"><b>Caja sin movimientos</b>Las ventas aparecen aquí en tiempo real.</div>'}`;
}

async function hojaMov(i){
  const v=S.ventas[i];if(!v)return;
  abrirSheet(`<h3>${money(v.monto)}</h3><p class="muted">${esc(v.paciente||'Mostrador')} · ${esc(v.hora||'')}</p>
    <div class="datos">
      <div><small>Método</small><b>${esc(v.metodo||'Efectivo')}</b></div>
      <div><small>Nota</small><b>${esc(v.folioNota||'—')}</b></div>
      <div class="ancho"><small>Concepto</small><b>${esc(strip(v.concepto))}</b></div>
    </div>
    <button class="btn rojo" id="bDel">Eliminar este pago</button>
    <button class="btn" onclick="cerrarSheet()">Cerrar</button>`);

  $('bDel').onclick=async()=>{
    if(!await confirmar('¿Eliminar pago?',`Se quitará ${money(v.monto)} del corte de caja.`,'Sí, eliminar'))return;
    const ref=db.collection('config').doc('ventasDiarias'),obj=JSON.stringify(v);
    try{
      await db.runTransaction(async tx=>{
        const d=await tx.get(ref),l=((d.exists&&d.data().lista)||[]).slice();
        const k=l.findIndex(x=>(v.uid&&x.uid===v.uid)||JSON.stringify(x)===obj);
        if(k<0)throw new Error('Ese pago ya no existe');
        l.splice(k,1);
        tx.update(ref,{lista:l});
      });
      cerrarSheet();
      toast('Pago eliminado ✓');
    }catch(e){toast('Error: '+e.message,1)}
  };
}
</script>
</body>
</html>
